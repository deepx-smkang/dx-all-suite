[pytest]
markers =
    sanity: quick prerequisite checks
    docker_install: Docker image build validation tests
    local_install: local installation validation tests
    getting_started: getting-started workflow validation tests
    compiler: compiler-related getting-started tests
    runtime: runtime-related getting-started tests
    version_compatibility: version compatibility matrix checks
    host_exclusive: tests that mutate host NPU stack; serialized across xdist workers
    install_option: install.sh option tests (run option combos, Ubuntu 24.04)
