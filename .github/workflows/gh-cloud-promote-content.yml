name: Promote content (staging -> main)

run-name: Promote content staging to main across target repos

on:
  workflow_dispatch:
    inputs:
      target_repos:
        description: 'Target repositories to merge (comma-separated owner/repo)'
        required: false
        default: 'DEEPX-AI/dx_rt,DEEPX-AI/dx_app,DEEPX-AI/dx_stream,DEEPX-AI/dx_rt_npu_linux_driver,DEEPX-AI/dx_fw,DEEPX-AI/dx-compiler,DEEPX-AI/dx-modelzoo,DEEPX-AI/dx-runtime,DEEPX-AI/dx-all-suite'
        type: string
      source_branch:
        description: 'Source branch to merge from'
        required: false
        default: 'staging'
        type: string
      target_branch:
        description: 'Target branch to merge into'
        required: false
        default: 'main'
        type: string
      commit_message:
        description: 'Commit message override (default: last staging commit subject)'
        required: false
        default: ''
        type: string

permissions: write-all

jobs:
  promote:
    uses: DEEPX-AI/do_workflows-central/.github/workflows/promote-content-to-main.yml@main
    with:
      target_repos: ${{ github.event.inputs.target_repos }}
      source_branch: ${{ github.event.inputs.source_branch }}
      target_branch: ${{ github.event.inputs.target_branch }}
      commit_message: ${{ github.event.inputs.commit_message }}
    secrets:
      token: ${{ secrets.GC_DCI_TOKEN }}
